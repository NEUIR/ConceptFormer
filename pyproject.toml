[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptformer"
version = "0.1.0"
description = "ConceptFormer visual document retrieval with latent concept representations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ConceptFormer Authors" }]
dependencies = [
  "accelerate==1.7.0",
  "datasets==3.6.0",
  "deepspeed==0.17.1",
  "einops==0.8.1",
  "numpy==1.26.4",
  "peft==0.11.1",
  "pillow==11.2.1",
  "pyarrow==20.0.0",
  "huggingface-hub>=0.31.0",
  "qwen-vl-utils>=0.0.14",
  "safetensors==0.5.3",
  "torch==2.6.0",
  "transformers==4.52.4",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.4"]
eval = ["faiss-cpu>=1.8.0", "pytrec-eval-terrier>=0.5.7"]
annotation = ["openai>=1.30.0", "pandas>=2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
